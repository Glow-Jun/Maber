<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/vendor/katex.min.css">
<link rel="stylesheet" href="/main.css">
<title>Maber</title>
</head>
<body>
<div id="app"></div>
<!-- 空状态水印：无文档时居中显示，任何点击穿透到下层 -->
<div id="empty" class="hidden" aria-hidden="true">
  <svg class="empty-logo" viewBox="0 0 48 48">
    <path class="mark" d="M13 35 V14 L24 29 L35 14 V35" fill="none" stroke="currentColor"
          stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="crease" d="M24 29 V35" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <div class="empty-mark">Maber<span class="dot">.</span></div>
  <div class="empty-hint">按 <kbd>Ctrl</kbd> + <kbd>O</kbd> 打开文件开始阅读</div>
  <div class="empty-sub">或从左侧最近文件开始</div>
</div>
<script type="module" src="/main.js"></script>
</body>
</html>
